<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b19"/>
      <stop offset="50%" stop-color="#0d172e"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>
    
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(0, 240, 255, 0)"/>
      <stop offset="50%" stop-color="rgba(0, 240, 255, 0.9)"/>
      <stop offset="70%" stop-color="rgba(16, 185, 129, 0.9)"/>
      <stop offset="100%" stop-color="rgba(16, 185, 129, 0)"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="40%" stop-color="#38BDF8"/>
      <stop offset="70%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>

    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="1"/>
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#070b19" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(56, 189, 248, 0.08)" stroke-width="1"/>
    </pattern>

    <style>
      @keyframes laserScan {
        0% { transform: translateX(-1200px); opacity: 0.1; }
        30% { opacity: 0.85; }
        70% { opacity: 0.85; }
        100% { transform: translateX(1200px); opacity: 0.1; }
      }
      @keyframes pulsePoints {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.95; transform: scale(1.3); }
      }
      @keyframes rotateReticule {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes floatParticle {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }
      .laser-beam {
        animation: laserScan 4.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      .point-group {
        animation: pulsePoints 3s ease-in-out infinite alternate;
      }
      .reticule {
        transform-origin: 1100px 180px;
        animation: rotateReticule 24s linear infinite;
      }
      .float-1 { animation: floatParticle 4s ease-in-out infinite; }
      .float-2 { animation: floatParticle 5s ease-in-out infinite 1s; }
      .float-3 { animation: floatParticle 6s ease-in-out infinite 2s; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1280" height="360" fill="url(#bgGrad)"/>
  <rect width="1280" height="360" fill="url(#grid)"/>

  <!-- 3D Spatial Grid Floor Perspective -->
  <g stroke="rgba(0, 240, 255, 0.12)" stroke-width="1" fill="none">
    <line x1="0" y1="360" x2="640" y2="210"/>
    <line x1="200" y1="360" x2="640" y2="210"/>
    <line x1="400" y1="360" x2="640" y2="210"/>
    <line x1="640" y1="360" x2="640" y2="210"/>
    <line x1="880" y1="360" x2="640" y2="210"/>
    <line x1="1080" y1="360" x2="640" y2="210"/>
    <line x1="1280" y1="360" x2="640" y2="210"/>
    <!-- Concentric horizon curves -->
    <ellipse cx="640" cy="210" rx="200" ry="40" stroke="rgba(16, 185, 129, 0.15)"/>
    <ellipse cx="640" cy="210" rx="400" ry="80" stroke="rgba(16, 185, 129, 0.1)"/>
    <ellipse cx="640" cy="210" rx="600" ry="120" stroke="rgba(16, 185, 129, 0.06)"/>
  </g>

  <!-- Animated LiDAR Laser Scanning Curtain -->
  <g>
    <rect class="laser-beam" x="600" y="0" width="80" height="360" fill="url(#laserGrad)" opacity="0.6"/>
  </g>

  <!-- Point Cloud Constellations (Right Side Tech Graphic) -->
  <g class="point-group">
    <!-- 3D Bounding Box Wireframe -->
    <polygon points="1020,110 1140,80 1200,130 1080,160" fill="rgba(0, 240, 255, 0.04)" stroke="rgba(0, 240, 255, 0.4)" stroke-width="1.5" stroke-dasharray="4,4"/>
    <polygon points="1020,220 1140,190 1200,240 1080,270" fill="rgba(16, 185, 129, 0.04)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.5"/>
    <line x1="1020" y1="110" x2="1020" y2="220" stroke="rgba(0, 240, 255, 0.4)" stroke-width="1.5"/>
    <line x1="1140" y1="80" x2="1140" y2="190" stroke="rgba(0, 240, 255, 0.4)" stroke-width="1.5"/>
    <line x1="1200" y1="130" x2="1200" y2="240" stroke="rgba(0, 240, 255, 0.4)" stroke-width="1.5"/>
    <line x1="1080" y1="160" x2="1080" y2="270" stroke="rgba(0, 240, 255, 0.4)" stroke-width="1.5"/>

    <!-- Point cloud dots -->
    <circle cx="1060" cy="130" r="3.5" fill="#00F0FF"/>
    <circle cx="1100" cy="110" r="2.5" fill="#38BDF8"/>
    <circle cx="1130" cy="150" r="3" fill="#34D399"/>
    <circle cx="1050" cy="180" r="4" fill="#10B981"/>
    <circle cx="1110" cy="210" r="3" fill="#F472B6"/>
    <circle cx="1160" cy="170" r="3.5" fill="#A78BFA"/>
    <circle cx="1080" cy="240" r="2.5" fill="#00F0FF"/>
    <circle cx="1150" cy="230" r="3" fill="#38BDF8"/>
    <circle cx="1030" cy="160" r="2" fill="#34D399"/>
    <circle cx="1180" cy="200" r="3" fill="#FCD34D"/>
    <circle cx="1070" cy="90" r="2" fill="#38BDF8"/>
    <circle cx="1170" cy="120" r="2.5" fill="#10B981"/>
  </g>

  <!-- Rotating Radar/LiDAR Reticule -->
  <g class="reticule" stroke="rgba(0, 240, 255, 0.25)" fill="none" stroke-width="1">
    <circle cx="1100" cy="180" r="100" stroke-dasharray="6,8"/>
    <circle cx="1100" cy="180" r="60" stroke-dasharray="3,5"/>
    <line x1="990" y1="180" x2="1210" y2="180"/>
    <line x1="1100" y1="70" x2="1100" y2="290"/>
    <circle cx="1100" cy="180" r="4" fill="#00F0FF"/>
  </g>

  <!-- Floating Particles & Depth Nodes -->
  <g class="float-1">
    <circle cx="120" cy="80" r="3" fill="rgba(0, 240, 255, 0.6)"/>
    <circle cx="280" cy="60" r="2" fill="rgba(52, 211, 153, 0.5)"/>
    <circle cx="500" cy="110" r="3" fill="rgba(167, 139, 250, 0.5)"/>
  </g>
  <g class="float-2">
    <circle cx="80" cy="260" r="2.5" fill="rgba(244, 114, 182, 0.6)"/>
    <circle cx="340" cy="290" r="3.5" fill="rgba(0, 240, 255, 0.5)"/>
    <circle cx="580" cy="270" r="2" fill="rgba(52, 211, 153, 0.6)"/>
  </g>

  <!-- Central / Left Hero Typography -->
  <g transform="translate(80, 0)">
    <!-- Category Badge -->
    <rect x="0" y="48" width="235" height="28" rx="14" fill="rgba(0, 240, 255, 0.12)" stroke="rgba(0, 240, 255, 0.4)" stroke-width="1"/>
    <circle cx="14" cy="62" r="4" fill="#00F0FF"/>
    <text x="26" y="67" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38BDF8" letter-spacing="1.5">REALITY CAPTURE ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="900" fill="url(#textGrad)" letter-spacing="-0.5">
      Awesome Reality Capture
    </text>

    <!-- Subtitle -->
    <text x="0" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500" fill="#94A3B8" letter-spacing="0.2">
      Photogrammetry • 360° Walkthroughs • 3D Gaussian Splats • LiDAR SLAM • Digital Twins
    </text>

    <!-- Feature Pillars Badges -->
    <g transform="translate(0, 210)">
      <!-- Badge 1: 3D Gaussian Splatting -->
      <g transform="translate(0, 0)">
        <rect width="168" height="32" rx="6" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1"/>
        <text x="12" y="21" font-family="sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">🔮 Gaussian Splatting</text>
      </g>
      <!-- Badge 2: Drone & Aerial SfM -->
      <g transform="translate(178, 0)">
        <rect width="145" height="32" rx="6" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(52, 211, 153, 0.3)" stroke-width="1"/>
        <text x="12" y="21" font-family="sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">🛸 Drone Mapping</text>
      </g>
      <!-- Badge 3: LiDAR SLAM -->
      <g transform="translate(333, 0)">
        <rect width="135" height="32" rx="6" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(167, 139, 250, 0.3)" stroke-width="1"/>
        <text x="12" y="21" font-family="sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">📡 LiDAR SLAM</text>
      </g>
      <!-- Badge 4: Digital Twins -->
      <g transform="translate(478, 0)">
        <rect width="140" height="32" rx="6" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(244, 114, 182, 0.3)" stroke-width="1"/>
        <text x="12" y="21" font-family="sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">🏗️ Digital Twins</text>
      </g>
      <!-- Badge 5: Open Source -->
      <g transform="translate(628, 0)">
        <rect width="145" height="32" rx="6" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(251, 191, 36, 0.3)" stroke-width="1"/>
        <text x="12" y="21" font-family="sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">⚡ Open Source</text>
      </g>
    </g>

    <!-- Bottom Specs / Last Updated -->
    <text x="0" y="280" font-family="sans-serif" font-size="13" font-weight="500" fill="#64748B">
      ⭐ Curated SaaS Platforms &amp; Top Open-Source Repositories • Real-World Pricing &amp; Benchmarks
    </text>
  </g>

  <!-- Outer frame border with glowing corner highlights -->
  <rect x="1" y="1" width="1278" height="358" rx="8" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1.5"/>
  <path d="M 1 30 L 1 1 L 30 1" fill="none" stroke="#00F0FF" stroke-width="3"/>
  <path d="M 1250 1 L 1279 1 L 1279 30" fill="none" stroke="#00F0FF" stroke-width="3"/>
  <path d="M 1279 330 L 1279 359 L 1250 359" fill="none" stroke="#10B981" stroke-width="3"/>
  <path d="M 30 359 L 1 359 L 1 330" fill="none" stroke="#10B981" stroke-width="3"/>
</svg>